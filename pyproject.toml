
[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py3-tpcc"
dynamic = ["version"]
authors = [
    { name="Sanjeev Bhatt", email="bhatt4982@gmail.com" },
]
description = "Python TPC-C Compliance Test Suite"
readme = "README.md"
license = "Apache-2.0"
license-files = [
    "LICENSE",
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "tomli; python_version < '3.11'",
    "tomli-w",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "nox",
]

[tool.setuptools]
dynamic = {"version" = {attr = "py3_tpcc.__version__"}}

[tool.setuptools.packages.find]
where = ["."]
include = ["py3_tpcc*"]

[project.urls]
Homepage = "https://github.com/bhatt4982/py3-tpcc/blob/main/README.md"
Repository = "https://github.com/bhatt4982/py3-tpcc"
